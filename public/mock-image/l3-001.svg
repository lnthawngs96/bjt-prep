<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Trưởng phòng và nhân viên đứng trước bảng lịch tuần, thứ Ba bị gạch và thứ Năm được khoanh">
  <rect width="640" height="400" fill="#eef3f8"/>
  <!-- bảng lịch -->
  <rect x="300" y="60" width="300" height="220" rx="8" fill="#ffffff" stroke="#9fb3c8" stroke-width="3"/>
  <g font-family="sans-serif" font-size="20" fill="#0a1828">
    <text x="330" y="110">月</text><text x="390" y="110">火</text><text x="450" y="110">水</text><text x="510" y="110">木</text><text x="570" y="110">金</text>
  </g>
  <line x1="382" y1="98" x2="410" y2="118" stroke="#c7365a" stroke-width="4"/>
  <line x1="410" y1="98" x2="382" y2="118" stroke="#c7365a" stroke-width="4"/>
  <circle cx="520" cy="104" r="22" fill="none" stroke="#1b4fd8" stroke-width="4"/>
  <text x="330" y="170" font-family="sans-serif" font-size="18" fill="#0a1828">定例会議 10:00</text>
  <!-- hai người -->
  <circle cx="110" cy="170" r="34" fill="#9fb3c8"/>
  <rect x="70" y="210" width="80" height="120" rx="14" fill="#1b4fd8"/>
  <circle cx="220" cy="180" r="30" fill="#9fb3c8"/>
  <rect x="185" y="215" width="70" height="115" rx="14" fill="#23c9c2"/>
  <text x="320" y="370" text-anchor="middle" font-size="22" fill="#0a1828" font-family="sans-serif">会議の日程変更</text>
</svg>
