<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Hai người đứng đối diện trao đổi danh thiếp trong phòng tiếp khách">
  <rect width="640" height="400" fill="#eef3f8"/>
  <rect x="0" y="300" width="640" height="100" fill="#d9e2ec"/>
  <!-- người A -->
  <circle cx="220" cy="150" r="34" fill="#9fb3c8"/>
  <rect x="180" y="190" width="80" height="120" rx="14" fill="#1b4fd8"/>
  <!-- người B -->
  <circle cx="420" cy="150" r="34" fill="#9fb3c8"/>
  <rect x="380" y="190" width="80" height="120" rx="14" fill="#23c9c2"/>
  <!-- danh thiếp -->
  <rect x="290" y="225" width="60" height="36" rx="3" fill="#ffffff" stroke="#0a1828" stroke-width="2" transform="rotate(-12 320 243)"/>
  <text x="320" y="360" text-anchor="middle" font-size="22" fill="#0a1828" font-family="sans-serif">名刺交換</text>
</svg>
